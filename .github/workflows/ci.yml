name: CI

on:
  push:
    branches: [dev, main, devansh-doctor]
  pull_request:
    branches: [dev, main]

jobs:
  repo-validation:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Repository contents:"
          ls -la

          if [ -d supabase ]; then
            echo "✅ Supabase directory found"
          else
            echo "❌ Supabase directory missing"
            exit 1
          fi

          if [ -d frontend ]; then
            echo "✅ Frontend directory found"
          else
            echo "⚠️ Frontend directory missing"
          fi

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: frontend_check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.frontend_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck || true

      - name: Lint
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint || true

      - name: Skip frontend validation
        if: steps.frontend_check.outputs.exists == 'false'
        run: |
          echo "⚠️ frontend/package.json not found"
          echo "Skipping frontend checks"

  validate-migrations:
    name: Validate Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate migration files
        run: |
          if [ -d supabase/migrations ]; then
            for f in supabase/migrations/*.sql; do
              echo "Checking $f..."
              grep -n "create table\|create policy\|create index\|create function" "$f" || true
            done
            echo "✅ Migration files present"
          else
            echo "⚠️ No migrations folder found"
          fi

  check-env-coverage:
    name: Check Environment Template
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example
        run: |
          if [ -f .env.example ]; then
            lines=$(wc -l < .env.example)
            echo "✅ .env.example found ($lines lines)"
          else
            echo "⚠️ .env.example not present"
          fi
