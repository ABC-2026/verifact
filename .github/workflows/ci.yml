name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck || true

      - name: Lint
        working-directory: frontend
        run: npm run lint || true

  validate-migrations:
    name: Validate Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Validate migration files
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            # Check for common SQL errors (basic syntax)
            grep -n "create table\|create policy\|create index\|create function" "$f" || true
          done
          echo "✅ Migration files present"

  check-env-coverage:
    name: Check .env.example Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env.example exists and is not empty
        run: |
          if [ ! -f .env.example ]; then
            echo "❌ .env.example missing"
            exit 1
          fi
          lines=$(wc -l < .env.example)
          echo "✅ .env.example has $lines lines"
